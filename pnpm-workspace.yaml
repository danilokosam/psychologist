packages:
  - "apps/*"
  - "packages/*"

# Native build scripts pnpm will not run without explicit approval
# (security default). Approved: Prisma's engine binaries and esbuild's
# native binary (needed by Prisma/Vitest/tsx, which we deliberately
# installed). Denied: sharp/unrs-resolver -- not used by anything yet
# (no image processing in Milestone 0).
allowBuilds:
  '@parcel/watcher': true
  '@prisma/client': true
  '@prisma/engines': true
  '@swc/core': true
  esbuild: true
  prisma: true
  sharp: false
  unrs-resolver: false

minimumReleaseAgeExclude:
  - jose@6.2.17

# Security overrides. Each one needs a reason and an exit condition.
overrides:
  # GHSA (high): stack exhaustion merging recursive objects, fixed in 8.x.
  # Only reached through @prisma/config 6.x (the Prisma CLI's config
  # loader), never with request data -- but production dependencies must
  # pass `pnpm audit --prod --audit-level high` in CI. Remove when Prisma is
  # upgraded to a version that depends on deepmerge-ts >= 8 itself.
  deepmerge-ts: ^8.0.2
