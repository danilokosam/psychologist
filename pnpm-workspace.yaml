packages:
  - "apps/*"
  - "packages/*"

# Native build scripts pnpm will not run without explicit approval
# (security default). Approved: Prisma's engine binaries and esbuild's
# native binary (needed by Prisma/Vitest/tsx, which we deliberately
# installed). Denied: sharp/unrs-resolver -- not used by anything yet
# (no image processing in Milestone 0).
allowBuilds:
  '@parcel/watcher': true
  '@prisma/client': true
  '@prisma/engines': true
  '@swc/core': true
  esbuild: true
  prisma: true
  sharp: false
  unrs-resolver: false

minimumReleaseAgeExclude:
  - jose@6.2.17
